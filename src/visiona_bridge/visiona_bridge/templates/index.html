<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Robot Arm Control V4.3 (Lite)</title>
    <style>
      :root {
        --bg-color: #1a1a1d;
        --panel-color: #2c2f33;
        --text-color: #c3c3c3;
        --heading-color: #ffffff;
        --border-color: #4f545c;
        --input-bg-color: #23272a;
        --accent-color: #7289da;
        --accent-hover: #677bc4;
        --danger-color: #f04747;
        --danger-hover: #d84040;
        --success-color: #43b581;
        --info-color: #3498db;
        --warn-color: #f1c40f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: var(--bg-color);
        color: var(--text-color);
        padding: 20px;
      }
      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        max-width: 1400px;
      }
      .panel {
        background-color: var(--panel-color);
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        margin: 10px;
      }
      h2 {
        margin-top: 0;
        color: var(--heading-color);
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
      }
      hr {
        border: none;
        border-top: 1px solid var(--border-color);
        margin: 20px 0;
      }
      .control-group,
      .status-item {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
      }
      input[type="number"],
      input[type="text"],
      input[type="color"],
      select {
        width: 80px;
        text-align: right;
        border: 1px solid var(--border-color);
        background-color: var(--input-bg-color);
        color: var(--text-color);
        border-radius: 4px;
        padding: 8px;
      }
      input[type="color"] {
        padding: 4px;
        height: 38px;
      }
      input[type="text"] {
        text-align: left;
        width: 150px;
      }
      select {
        width: 180px;
        text-align: left;
      }
      .value-display {
        font-weight: bold;
        color: var(--accent-color);
        margin-left: 10px;
      }
      button {
        background-color: var(--accent-color);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
        font-weight: 500;
        transition: background-color 0.2s;
        margin-top: 5px;
        margin-right: 5px;
      }
      button:hover {
        background-color: var(--accent-hover);
      }
      button:disabled {
        background-color: #555;
        cursor: not-allowed;
        opacity: 0.7;
      }
      .btn-danger {
        background-color: var(--danger-color) !important;
      }
      .btn-danger:hover {
        background-color: var(--danger-hover) !important;
      }
      .btn-success {
        background-color: var(--success-color);
      }
      .btn-success:hover {
        background-color: #3aa170;
      }
      .btn-warn {
        background-color: var(--warn-color);
        color: #333;
      }
      .btn-warn:hover {
        background-color: #d8ae0a;
      }
      .btn-reconnect {
        background-color: var(--warn-color);
        color: #333;
      }
      .btn-reconnect:hover {
        background-color: #d8ae0a;
      }
      .status-value {
        font-family: "Courier New", Courier, monospace;
        background-color: var(--input-bg-color);
        padding: 5px 8px;
        border-radius: 4px;
        border: 1px solid var(--border-color);
      }
      .status-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 20px;
      }
      .status-box {
        padding: 15px;
        border-radius: 5px;
        text-align: center;
        font-weight: bold;
        color: white;
      }
      .status-ok {
        background-color: var(--success-color);
      }
      .status-warn {
        background-color: var(--danger-color);
      }
      .btn-group {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 8px;
        background: var(--input-bg-color);
        border-radius: 5px;
        outline: none;
        cursor: pointer;
        border: 1px solid var(--border-color);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        background: var(--accent-color);
        border-radius: 50%;
        cursor: pointer;
      }
      .sequence-list,
      .positions-list {
        max-height: 200px;
        overflow-y: auto;
        background-color: var(--input-bg-color);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 10px;
        margin-top: 10px;
        font-family: monospace;
        font-size: 0.9em;
      }
      .sequence-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 0;
        border-bottom: 1px solid var(--border-color);
        gap: 10px;
      }
      .sequence-item:last-child {
        border-bottom: none;
      }
      .sequence-item span {
        flex-grow: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.9em;
      }
      .sequence-item button {
        padding: 3px 8px;
        font-size: 0.8em;
        flex-shrink: 0;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #555;
        transition: 0.4s;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.4s;
      }
      input:checked + .slider {
        background-color: var(--success-color);
      }
      input:checked + .slider:before {
        transform: translateX(26px);
      }
      .slider.round {
        border-radius: 24px;
      }
      .slider.round:before {
        border-radius: 50%;
      }
      .config-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 5px 10px;
      }
      .config-grid input {
        width: 100%;
        padding: 5px;
        font-size: 0.9em;
      }
      .grid-header {
        font-weight: bold;
        font-size: 0.9em;
        text-align: center;
      }
      .tab-bar {
        overflow: hidden;
        background-color: var(--panel-color);
        border-radius: 8px;
        width: 100%;
        max-width: 1400px;
        margin-bottom: 10px;
      }
      .tab-button {
        background-color: inherit;
        float: left;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 14px 20px;
        transition: 0.3s;
        font-size: 1.1em;
        color: var(--text-color);
        font-weight: 500;
      }
      .tab-button:hover {
        background-color: var(--border-color);
      }
      .tab-button.active {
        background-color: var(--accent-color);
        color: white;
      }
      .tab-content {
        width: 100%;
        max-width: 1400px;
      }
      .tab-pane {
        display: none;
        width: 100%;
        animation: 0.5s ease 0s 1 fadeIn;
      }
      .tab-pane.active {
        display: block;
      }
      @keyframes fadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      .tab-layout {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 10px;
      }
      .tab-layout .panel {
        margin: 0;
      }
      .panel-col-1-3 {
        flex: 1 1 350px;
        min-width: 350px;
      }
      .panel-col-2-3 {
        flex: 2 1 600px;
        min-width: 400px;
        position: relative;
      }
      .panel-full {
        flex: 1 1 100%;
      }
      #log-panel {
        width: 100%;
        max-width: 1400px;
        margin-top: 20px;
      }
      #log-box {
        background-color: var(--input-bg-color);
        border: 1px solid var(--border-color);
        border-radius: 5px;
        height: 150px;
        overflow-y: scroll;
        padding: 10px;
        font-family: monospace;
        font-size: 0.9em;
      }
      #log-box p {
        margin: 0 0 5px 0;
      }
      .log-info {
        color: var(--info-color);
      }
      .log-warn {
        color: var(--warn-color);
      }
      .log-error {
        color: var(--danger-color);
      }
      .log-success {
        color: var(--success-color);
      }
    </style>
  </head>
  <body>
    <div class="tab-bar">
      <button class="tab-button active" onclick="openTab(event, 'tab-control')">
        🤖 Control
      </button>
      <button class="tab-button" onclick="openTab(event, 'tab-sequencer')">
        📊 Sequencer
      </button>
      <button class="tab-button" onclick="openTab(event, 'tab-settings')">
        ⚙️ Settings
      </button>
    </div>

    <div class="tab-content">
      <div id="tab-control" class="tab-pane active">
        <div class="tab-layout">
          <div class="panel panel-col-1-3">
            <h2>Status</h2>
            <div class="status-item">
              <label>Connection Status:</label>
              <div id="connection-status" class="status-box status-warn">
                DISCONNECTED
              </div>
              <div
                class="status-item"
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  margin-top: 10px;
                  margin-bottom: 0;
                "
              >
                <label for="sim-mode-toggle" style="margin-bottom: 0"
                  >Simulation Mode:</label
                >
                <label class="switch">
                  <input
                    type="checkbox"
                    id="sim-mode-toggle"
                    onchange="setSimulationMode()"
                  />
                  <span class="slider round"></span>
                </label>
              </div>
              <button
                id="reconnect-btn"
                class="btn-reconnect"
                onclick="reconnectMcu()"
                style="display: block; margin-top: 10px; width: 100%"
              >
                Reconnect to MCU
              </button>
            </div>
            <div class="status-item">
              <label>Emergency Stop:</label>
              <div id="estop-status" class="status-box status-warn">
                INACTIVE
              </div>
              <button
                id="release-estop-btn"
                class="btn-danger"
                onclick="releaseEstop()"
                style="display: none; margin-top: 10px; width: 100%"
              >
                Release E-Stop
              </button>
            </div>
            <div class="status-item">
              <label>Currents:</label>
              <span class="status-value" id="main-current">0.00 A</span> |
              <span class="status-value" id="gripper-current">0.00 mA</span>
            </div>
            <div class="status-item">
              <label>Current Joint Angles (°):</label>
              <div id="joint-status-display" class="status-grid"></div>
            </div>
          </div>

          <div class="panel panel-col-2-3">
            <h2>Controls</h2>
            <div id="joint-sliders"></div>
            <hr />
            <div class="control-group">
              <label for="speed-slider"
                >Speed Factor:
                <span id="speed-value" class="value-display">150</span></label
              >
              <input
                type="range"
                id="speed-slider"
                min="10"
                max="500"
                value="150"
              />
            </div>
            <hr />
            <div class="control-group">
              <label>Gripper Command</label>
              <div class="btn-group">
                <input
                  type="number"
                  id="gripper-angle-input"
                  placeholder="Angle °"
                  value="90"
                  min="0"
                  max="180"
                />
                <input
                  type="number"
                  id="gripper-current-input"
                  placeholder="Current mA"
                  value="200"
                  min="0"
                />
                <button onclick="sendGripperCommand()">Set Gripper</button>
              </div>
            </div>
            <hr />
            <div class="control-group">
              <label for="fan-speed-slider"
                >Fan Control (Duty Cycle):
                <span id="fan-speed-value" class="value-display"
                  >18</span
                ></label
              >
              <input
                type="range"
                id="fan-speed-slider"
                min="0"
                max="255"
                value="18"
              />
            </div>
            <hr />
            <div class="control-group">
              <button onclick="sendHomeCommand()">Home Robot</button>
            </div>
          </div>

          <div class="panel panel-col-1-3">
            <h2>Saved Positions</h2>
            <div class="control-group">
              <label for="position-name">Position Name:</label>
              <div class="btn-group">
                <input
                  type="text"
                  id="position-name"
                  placeholder="Enter name..."
                />
                <button onclick="savePosition()" class="btn-success">
                  Save Current
                </button>
              </div>
            </div>
            <div class="control-group">
              <label for="saved-positions-select">Go To / Delete:</label>
              <div class="btn-group">
                <select id="saved-positions-select">
                  <option value="">-- Select Position --</option>
                </select>
                <button id="go-to-pos-btn" onclick="goToPosition()">
                  Go To
                </button>
                <button
                  id="delete-pos-btn"
                  onclick="deletePosition()"
                  class="btn-danger"
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-sequencer" class="tab-pane">
        <div class="tab-layout">
          <div class="panel panel-full">
            <h2>Sequencer</h2>
            <div class="control-group">
              <label for="sequence-delay">Delay After Point (ms):</label>
              <div class="btn-group">
                <input
                  type="number"
                  id="sequence-delay"
                  value="500"
                  min="0"
                  step="50"
                  style="width: 100px"
                />
                <button onclick="addSequencePoint()">Add Current Pose</button>
              </div>
            </div>
            <div class="control-group">
              <label>Sequence Steps:</label>
              <div id="sequence-list" class="sequence-list"></div>
            </div>
            <div class="control-group btn-group">
              <button id="play-sequence-btn" onclick="playSequence()">
                Play
              </button>
              <button id="stop-sequence-btn" onclick="stopSequence()" disabled>
                Stop
              </button>
              <button onclick="clearSequence()" class="btn-danger">
                Clear
              </button>
            </div>
            <hr />
            <div class="control-group">
              <label for="sequence-filename">Filename:</label>
              <div class="btn-group">
                <input
                  type="text"
                  id="sequence-filename"
                  placeholder="current_sequence.json"
                />
                <button onclick="saveSequence()" class="btn-success">
                  Save
                </button>
                <button onclick="loadSequence()" class="btn-warn">Load</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-settings" class="tab-pane">
        <div class="tab-layout">
          <div class="panel panel-col-1-3">
            <h2>Configuration</h2>
            <div class="control-group">
              <label for="threshold-input">Absolute Max Threshold (A)</label>
              <div class="btn-group">
                <input
                  type="number"
                  id="threshold-input"
                  value="5.0"
                  step="0.1"
                  min="0.1"
                  max="20.0"
                />
                <button onclick="sendThreshold()">Set RAM</button>
              </div>
            </div>
            <div class="control-group">
              <label for="dev-threshold-input">Deviation Threshold (A)</label>
              <div class="btn-group">
                <input
                  type="number"
                  id="dev-threshold-input"
                  value="1.0"
                  step="0.05"
                  min="0.05"
                  max="10.0"
                />
                <button onclick="sendDevThreshold()">Set RAM</button>
              </div>
            </div>
            <hr />
            <div class="control-group">
              <label>Joint Angle Limits (°)</label>
              <div id="limit-config-grid" class="config-grid">
                <div class="grid-header">Joint</div>
                <div class="grid-header">Min</div>
                <div class="grid-header">Max</div>
              </div>
              <div class="btn-group" style="margin-top: 15px">
                <button onclick="sendMinLimits()">Set Min (RAM)</button>
                <button onclick="sendMaxLimits()">Set Max (RAM)</button>
              </div>
            </div>
            <hr />
            <div class="control-group">
              <label>Persistence</label>
              <button onclick="saveMcuConfig()" class="btn-success">
                Save Current Config to MCU
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel" id="log-panel">
      <h2>Event Log</h2>
      <div id="log-box"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>
      // --- (JavaScript: Globals) ---
      const JOINT_NAMES = [
        "Base",
        "Shoulder",
        "Elbow",
        "Wrist 1",
        "Wrist 2",
        "Gripper",
      ];
      let jointSliderTimeout = null,
        speedSliderTimeout = null,
        fanSliderTimeout = null;
      let activeSlider = null,
        activeInput = null;
      let isGuiInitialized = false;
      let isPlayingSequence = false;

      // Placeholder to prevent errors in existing logic
      window.updateRobotModel = (anglesRad) => {};

      let socket = null;

      document.addEventListener("DOMContentLoaded", () => {
        initializeGui();
        connectWebSocket();
      });

      // --- Tab switching function ---
      function openTab(evt, tabName) {
        let i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tab-pane");
        for (i = 0; i < tabcontent.length; i++) {
          tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tab-button");
        for (i = 0; i < tablinks.length; i++) {
          tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).style.display = "block";
        if (evt) evt.currentTarget.className += " active";
      }

      function connectWebSocket() {
        if (socket && socket.connected) return;
        console.log("Attempting WebSocket connection...");
        if (socket) {
          socket.disconnect();
          socket = null;
        }
        socket = io({
          transports: ["websocket"],
          reconnectionAttempts: 5,
          reconnectionDelay: 2000,
        });
        socket.on("connect", () => {
          console.log("WebSocket connected.");
          logMessage("success", "Connected to WebSocket server.");
        });
        socket.on("disconnect", (reason) => {
          console.log("WebSocket disconnected:", reason);
          logMessage("error", `Disconnected from WebSocket server (${reason})`);
          updateStatusUI({
            is_connected: false,
            emergency_stop_active: false,
            is_playing: false,
            simulation_mode: false,
          });
        });
        socket.on("connect_error", (error) => {
          console.error("WebSocket connection error:", error);
          logMessage("error", `WebSocket connection error: ${error.message}`);
        });
        socket.on("status_update", (data) => {
          updateStatusUI(data);
        });
        socket.on("log_message", (data) =>
          logMessage(data.level, data.message)
        );
        socket.on("playback_stopped", () => {
          console.log("Received playback_stopped event");
          isPlayingSequence = false;
          updateStatusUI(); // Refresh UI to re-enable buttons
        });
      }

      // --- initializeGui ---
      function initializeGui() {
        if (isGuiInitialized) return;

        const slidersContainer = document.getElementById("joint-sliders");
        const statusContainer = document.getElementById("joint-status-display");
        const limitsContainer = document.getElementById("limit-config-grid");

        [
          "threshold-input",
          "dev-threshold-input",
          "gripper-angle-input",
          "gripper-current-input",
          "sequence-delay",
          "position-name",
          "sequence-filename",
        ].forEach((id) => {
          const input = document.getElementById(id);
          if (input) {
            input.addEventListener("focus", () => (activeInput = id));
            input.addEventListener("blur", () => {
              if (activeInput === id) activeInput = null;
            });
          }
        });

        JOINT_NAMES.forEach((name, i) => {
          slidersContainer.innerHTML += `<div class="control-group"><label for="j${i}">${name} (J${i}): <span id="j${i}-value" class="value-display">90</span>°</label><input type="range" id="j${i}" value="90"></div>`;
          statusContainer.innerHTML += `<div>${name}: <span id="s${i}" class="status-value">0.00</span></div>`;
          limitsContainer.innerHTML += `<label for="min-j${i}">J${i}:</label><input type="number" id="min-j${i}" value="0"><input type="number" id="max-j${i}" value="180">`;
        });

        JOINT_NAMES.forEach((_, i) => {
          const slider = document.getElementById(`j${i}`);
          slider.addEventListener("input", (e) => {
            document.getElementById(`j${i}-value`).textContent = e.target.value;
            sendJointCommandDebounced();
          });
          slider.addEventListener(
            "mousedown",
            () => (activeSlider = slider.id)
          );
          document.addEventListener("mouseup", () => {
            if (activeSlider === slider.id) activeSlider = null;
          });
          const minInput = document.getElementById(`min-j${i}`);
          minInput.addEventListener("focus", () => (activeInput = minInput.id));
          minInput.addEventListener("blur", () => {
            if (activeInput === minInput.id) activeInput = null;
          });
          const maxInput = document.getElementById(`max-j${i}`);
          maxInput.addEventListener("focus", () => (activeInput = maxInput.id));
          maxInput.addEventListener("blur", () => {
            if (activeInput === maxInput.id) activeInput = null;
          });
        });

        document.addEventListener("mouseup", () => {
          activeSlider = null;
        });

        const speedSlider = document.getElementById("speed-slider");
        speedSlider.addEventListener("input", (e) => {
          document.getElementById("speed-value").textContent = e.target.value;
          setSpeedDebounced();
        });
        speedSlider.addEventListener(
          "mousedown",
          () => (activeSlider = speedSlider.id)
        );

        const fanSlider = document.getElementById("fan-speed-slider");
        fanSlider.addEventListener("input", (e) => {
          document.getElementById("fan-speed-value").textContent =
            e.target.value;
          setFanSpeedDebounced();
        });
        fanSlider.addEventListener(
          "mousedown",
          () => (activeSlider = fanSlider.id)
        );

        isGuiInitialized = true;
        console.log("GUI Initialized");

        updateStatusUI();
        openTab(null, "tab-control");
      }

      const logMessage = (level, message) => {
        const logBox = document.getElementById("log-box");
        if (!logBox) return;
        const timestamp = new Date().toLocaleTimeString();
        const p = document.createElement("p");
        p.className = `log-${level}`;
        p.textContent = `[${timestamp}] ${message}`;
        logBox.appendChild(p);
        logBox.scrollTop = logBox.scrollHeight;
      };
      const apiPost = async (endpoint, body = {}) => {
        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!response.ok) {
            logMessage(
              "error",
              `API Request Failed: ${endpoint} - ${response.status} ${response.statusText}`
            );
            console.error(
              "API Error Response:",
              await response.text().catch(() => "Could not read error body")
            );
          }
        } catch (error) {
          console.error("API Post Error:", error);
          logMessage(
            "error",
            `API Request Failed: ${endpoint} - ${error.message}`
          );
        }
      };

      const sendJointCommandDebounced = () => {
        if (isPlayingSequence) return;
        clearTimeout(jointSliderTimeout);
        jointSliderTimeout = setTimeout(sendAllJoints, 50);
      };
      const setSpeedDebounced = () => {
        clearTimeout(speedSliderTimeout);
        speedSliderTimeout = setTimeout(setSpeed, 100);
      };
      const setFanSpeedDebounced = () => {
        clearTimeout(fanSliderTimeout);
        fanSliderTimeout = setTimeout(setFanSpeed, 100);
      };

      const sendAllJoints = () => {
        if (isPlayingSequence) return;
        const angles = JOINT_NAMES.map((_, i) =>
          parseFloat(document.getElementById(`j${i}`).value)
        );
        apiPost("/api/send_joints", { angles });
      };

      const sendHomeCommand = () => apiPost("/api/home");
      const sendGripperCommand = () => {
        const angle = parseFloat(
          document.getElementById("gripper-angle-input").value
        );
        const current = parseFloat(
          document.getElementById("gripper-current-input").value
        );
        apiPost("/api/send_gripper", { angle, current });
      };
      const setSpeed = () => {
        const speed = parseFloat(document.getElementById("speed-slider").value);
        apiPost("/api/set_speed", { speed });
      };
      const setFanSpeed = () => {
        const speed = parseFloat(
          document.getElementById("fan-speed-slider").value
        );
        apiPost("/api/set_fan_speed", { speed });
      };
      const sendMinLimits = () => {
        const limits = JOINT_NAMES.map((_, i) =>
          parseFloat(document.getElementById(`min-j${i}`).value)
        );
        apiPost("/api/set_min_limits", { limits });
      };
      const sendMaxLimits = () => {
        const limits = JOINT_NAMES.map((_, i) =>
          parseFloat(document.getElementById(`max-j${i}`).value)
        );
        apiPost("/api/set_max_limits", { limits });
      };
      const sendThreshold = () => {
        const threshold = parseFloat(
          document.getElementById("threshold-input").value
        );
        apiPost("/api/set_threshold", { threshold });
      };
      const sendDevThreshold = () => {
        const threshold = parseFloat(
          document.getElementById("dev-threshold-input").value
        );
        apiPost("/api/set_dev_threshold", { threshold });
      };
      const saveMcuConfig = () => apiPost("/api/save_mcu_config");
      const releaseEstop = () => apiPost("/api/release_estop");
      const reconnectMcu = () => apiPost("/api/reconnect");
      const addSequencePoint = () => {
        const delay = parseInt(document.getElementById("sequence-delay").value);
        apiPost("/api/add_sequence_point", { delay_ms: delay });
      };
      const clearSequence = () => {
        if (confirm("Clear the entire sequence?"))
          apiPost("/api/clear_sequence");
      };
      const deleteSequencePoint = (index) =>
        apiPost("/api/delete_sequence_point", { index });
      const saveSequence = () => {
        const filename =
          document.getElementById("sequence-filename").value || null;
        apiPost("/api/save_sequence", { filename });
      };
      const loadSequence = () => {
        const filename =
          document.getElementById("sequence-filename").value || null;
        apiPost("/api/load_sequence", { filename });
      };
      const playSequence = () => apiPost("/api/play_sequence");
      const stopSequence = () => apiPost("/api/stop_sequence");
      const savePosition = () => {
        const name = document.getElementById("position-name").value;
        if (name && name.trim()) {
          apiPost("/api/save_position", { name: name.trim() });
        } else {
          logMessage("warn", "Please enter a name for the position.");
        }
      };
      const goToPosition = () => {
        const name = document.getElementById("saved-positions-select").value;
        if (name) {
          apiPost("/api/go_to_position", { name });
        } else {
          logMessage("warn", "Please select a position to go to.");
        }
      };
      const deletePosition = () => {
        const name = document.getElementById("saved-positions-select").value;
        if (name) {
          if (confirm(`Delete position '${name}'?`)) {
            apiPost("/api/delete_position", { name });
          }
        } else {
          logMessage("warn", "Please select a position to delete.");
        }
      };
      const setSimulationMode = () => {
        const enable = document.getElementById("sim-mode-toggle").checked;
        apiPost("/api/set_simulation_mode", { enable });
        logMessage(
          enable ? "warn" : "info",
          `Simulation mode ${enable ? "ENABLED" : "DISABLED"}.`
        );
      };

      // --- updateStatusUI ---
      function updateStatusUI(data) {
        if (!isGuiInitialized) {
          console.warn("GUI not ready for update");
          return;
        }
        data = data || {
          is_connected: false,
          emergency_stop_active: false,
          is_playing: false,
          joint_angles: null,
          sequence: [],
          saved_positions: [],
          simulation_mode: false,
        };
        const isSimMode = data.simulation_mode === true;
        const simToggle = document.getElementById("sim-mode-toggle");
        if (simToggle && simToggle.checked !== isSimMode) {
          simToggle.checked = isSimMode;
        }
        const connStatus = document.getElementById("connection-status");
        const reconnectBtn = document.getElementById("reconnect-btn");
        const isConnected = data.is_connected === true;
        if (connStatus) {
          if (isSimMode) {
            connStatus.textContent = "SIMULATION ACTIVE";
            connStatus.className = "status-box status-ok";
          } else {
            connStatus.textContent = isConnected
              ? "MCU CONNECTED"
              : "MCU DISCONNECTED";
            connStatus.className =
              "status-box " + (isConnected ? "status-ok" : "status-warn");
          }
        }
        if (reconnectBtn)
          reconnectBtn.style.display =
            isConnected || isSimMode ? "none" : "block";
        const estopStatus = document.getElementById("estop-status");
        const releaseBtn = document.getElementById("release-estop-btn");
        const isEstopActive = data.emergency_stop_active === true;
        if (estopStatus) {
          estopStatus.textContent = isEstopActive ? "ACTIVE" : "INACTIVE";
          estopStatus.className =
            "status-box " + (isEstopActive ? "status-warn" : "status-ok");
        }
        if (releaseBtn) {
          releaseBtn.style.display = isEstopActive ? "block" : "none";
          releaseBtn.disabled = !isConnected && !isSimMode;
        }
        isPlayingSequence = data.is_playing === true;
        const playBtn = document.getElementById("play-sequence-btn");
        const stopBtn = document.getElementById("stop-sequence-btn");
        const goToPosBtn = document.getElementById("go-to-pos-btn");
        const deletePosBtn = document.getElementById("delete-pos-btn");
        const isControlDisabled =
          isPlayingSequence || isEstopActive || (!isConnected && !isSimMode);
        if (playBtn) playBtn.disabled = isControlDisabled;
        if (stopBtn) stopBtn.disabled = !isPlayingSequence;
        if (goToPosBtn) goToPosBtn.disabled = isControlDisabled;
        if (deletePosBtn)
          deletePosBtn.disabled =
            isControlDisabled ||
            !document.getElementById("saved-positions-select").value;
        JOINT_NAMES.forEach((_, i) => {
          const sliderEl = document.getElementById(`j${i}`);
          if (sliderEl) sliderEl.disabled = isControlDisabled;
        });
        if (simToggle) simToggle.disabled = isPlayingSequence;
        const mainCurrentEl = document.getElementById("main-current");
        const gripperCurrentEl = document.getElementById("gripper-current");
        if (isConnected || isSimMode) {
          if (mainCurrentEl)
            mainCurrentEl.textContent = `${(data.main_current ?? 0).toFixed(
              2
            )} A`;
          if (gripperCurrentEl)
            gripperCurrentEl.textContent = `${(
              data.gripper_current ?? 0
            ).toFixed(2)} mA`;
          if (data.joint_angles && data.joint_angles.length === 6) {
            const anglesRad = data.joint_angles.map(
              (deg) => (deg * Math.PI) / 180.0
            );
            window.updateRobotModel(anglesRad);
            data.joint_angles.forEach((angle, i) => {
              const sliderId = `j${i}`;
              const statusEl = document.getElementById(`s${i}`);
              const sliderEl = document.getElementById(sliderId);
              const valueEl = document.getElementById(`${sliderId}-value`);
              if (statusEl) statusEl.textContent = angle.toFixed(1);
              if (sliderEl && activeSlider !== sliderId && !isPlayingSequence) {
                if (Math.abs(sliderEl.value - angle) > 0.5) {
                  sliderEl.value = angle;
                }
                if (valueEl) valueEl.textContent = Math.round(angle);
              } else if (sliderEl && valueEl && activeSlider === sliderId) {
                valueEl.textContent = sliderEl.value;
              }
            });
          } else if (data.joint_angles === null) {
            JOINT_NAMES.forEach((_, i) => {
              const statusEl = document.getElementById(`s${i}`);
              if (statusEl) statusEl.textContent = "---";
            });
          }
          const thresholdEl = document.getElementById("threshold-input");
          if (
            thresholdEl &&
            data.collision_threshold !== undefined &&
            activeInput !== "threshold-input"
          ) {
            thresholdEl.value = data.collision_threshold.toFixed(2);
          }
          const devThresholdEl = document.getElementById("dev-threshold-input");
          if (
            devThresholdEl &&
            data.collision_deviation_threshold !== undefined &&
            activeInput !== "dev-threshold-input"
          ) {
            devThresholdEl.value =
              data.collision_deviation_threshold.toFixed(2);
          }
          const fanSliderEl = document.getElementById("fan-speed-slider");
          const fanValueEl = document.getElementById("fan-speed-value");
          if (
            fanSliderEl &&
            data.fan_speed !== undefined &&
            activeSlider !== "fan-speed-slider"
          ) {
            fanSliderEl.value = data.fan_speed;
            if (fanValueEl) fanValueEl.textContent = data.fan_speed;
          }
          const speedSliderEl = document.getElementById("speed-slider");
          const speedValueEl = document.getElementById("speed-value");
          if (
            speedSliderEl &&
            data.current_speed_factor !== undefined &&
            activeSlider !== "speed-slider"
          ) {
            speedSliderEl.value = data.current_speed_factor;
            if (speedValueEl)
              speedValueEl.textContent = Math.round(data.current_speed_factor);
          }
          if (data.servos_min) {
            data.servos_min.forEach((min_val, i) => {
              const minInputEl = document.getElementById(`min-j${i}`);
              const sliderEl = document.getElementById(`j${i}`);
              if (minInputEl && activeInput !== `min-j${i}`) {
                minInputEl.value = min_val.toFixed(1);
              }
              if (sliderEl) sliderEl.min = min_val;
            });
          }
          if (data.servos_max) {
            data.servos_max.forEach((max_val, i) => {
              const maxInputEl = document.getElementById(`max-j${i}`);
              const sliderEl = document.getElementById(`j${i}`);
              if (maxInputEl && activeInput !== `max-j${i}`) {
                maxInputEl.value = max_val.toFixed(1);
              }
              if (sliderEl) sliderEl.max = max_val;
            });
          }
        } else {
          if (mainCurrentEl) mainCurrentEl.textContent = `--- A`;
          if (gripperCurrentEl) gripperCurrentEl.textContent = `--- mA`;
          JOINT_NAMES.forEach((_, i) => {
            const statusEl = document.getElementById(`s${i}`);
            if (statusEl) statusEl.textContent = "---";
          });
        }
        const sequenceList = document.getElementById("sequence-list");
        if (sequenceList) {
          sequenceList.innerHTML = "";
          if (
            data.sequence &&
            Array.isArray(data.sequence) &&
            data.sequence.length > 0
          ) {
            data.sequence.forEach((point, index) => {
              const anglesStr = point.angles.map((a) => a.toFixed(1)).join(",");
              const item = document.createElement("div");
              item.className = "sequence-item";
              item.innerHTML = `
                        <span>${
                          index + 1
                        }: [${anglesStr}] Spd:${point.speed.toFixed(0)} Del:${
                point.delay_ms
              }ms</span>
                        <button onclick="deleteSequencePoint(${index})" class="btn-danger" ${
                isControlDisabled ? "disabled" : ""
              }>X</button> `;
              sequenceList.appendChild(item);
            });
          } else {
            sequenceList.innerHTML = "<span>Sequence is empty.</span>";
          }
        }
        const positionsSelect = document.getElementById(
          "saved-positions-select"
        );
        if (positionsSelect && deletePosBtn) {
          const currentSelection = positionsSelect.value;
          positionsSelect.innerHTML =
            '<option value="">-- Select Position --</option>';
          let selectionFound = false;
          if (data.saved_positions && Array.isArray(data.saved_positions)) {
            data.saved_positions.sort().forEach((name) => {
              const option = document.createElement("option");
              option.value = name;
              option.textContent = name;
              if (name === currentSelection) {
                option.selected = true;
                selectionFound = true;
              }
              positionsSelect.appendChild(option);
            });
          }
          deletePosBtn.disabled = isControlDisabled || !selectionFound;
        }
      }
    </script>
  </body>
</html>
