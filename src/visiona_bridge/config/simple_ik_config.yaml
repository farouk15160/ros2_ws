simple_ik_solver:
  ros__parameters:
    # =========================================================================
    # This config forwards to kinematic_params.yaml values.
    # See config/kinematic_params.yaml for the master DH parameter definition.
    # =========================================================================

    # DH parameters [a, alpha, d, theta_offset] for each joint
    dh_params:
      joint_0: {a: 0.0,   alpha: 1.5708, d: 0.14,   theta_offset: 0.0}
      joint_1: {a: 0.185, alpha: 0.0,    d: 0.0,    theta_offset: 0.0}
      joint_2: {a: 0.119, alpha: 0.0,    d: 0.0,    theta_offset: 0.0}
      joint_3: {a: 0.25,  alpha: 0.0,    d: -0.005, theta_offset: 0.0}

    # IK solver tuning
    ik_solver:
      max_iterations: 200
      tolerance: 0.001
      damping: 0.05
      step_alpha: 0.5

    # Trajectory
    trajectory:
      control_rate: 50.0
      max_joint_speed: 1.0

    # Collision
    collision:
      enable_obstacle_avoidance: true
      obstacle_safety_margin: 0.10
      self_collision_min_dist: 0.05
      ground_clearance: -0.02
      max_elbow_sum: 5.5
