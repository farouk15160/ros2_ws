simple_ik_solver:
  ros__parameters:
    # IK solver parameters
    max_iterations: 100
    tolerance: 0.001  # 1mm convergence tolerance
    step_size: 0.01   # 1cm per waypoint (smooth motion)
    control_rate: 20.0  # Hz - rate of sending waypoints
    max_speed: 0.1    # m/s maximum end-effector speed
    
    # Robot-specific DH parameters
    # Format: [a, alpha, d, theta_offset] for each joint
    # UPDATE THESE WITH YOUR ACTUAL ROBOT PARAMETERS
    dh_parameters:
      joint_0:
        a: 0.0
        alpha: 0.0
        d: 0.15
        theta_offset: 0.0
      joint_1:
        a: 0.0
        alpha: 1.5708  # pi/2
        d: 0.0
        theta_offset: 0.0
      joint_2:
        a: 0.25
        alpha: 0.0
        d: 0.0
        theta_offset: 0.0
      joint_3:
        a: 0.25
        alpha: 0.0
        d: 0.0
        theta_offset: 0.0
    
    # Joint limits (radians)
    joint_limits:
      lower: [-1.57, -1.57, -1.57, -1.57, -1.57, -1.57]
      upper: [1.57, 1.57, 1.57, 1.57, 1.57, 1.57]
    
    # Workspace limits (meters)
    workspace_limits:
      x_min: -0.5
      x_max: 0.5
      y_min: -0.5
      y_max: 0.5
      z_min: 0.0
      z_max: 0.8
