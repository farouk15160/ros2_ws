vla_action_generator:
  ros__parameters:
    # Model settings
    model_name: "llava-hf/llava-v1.6-mistral-7b-hf"
    quantization: "4bit"
    device: "cuda"
    torch_dtype: "float16"
    
    # Vision settings
    max_resolution: [640, 480]
    downsample_factor: 1
    
    # Camera topics
    rgb_topic: "/ascamera_hp60c/camera_publisher/rgb0/image"
    depth_topic: "/ascamera_hp60c/camera_publisher/depth0/points"
    camera_info_topic: "/ascamera_hp60c/camera_publisher/rgb0/camera_info"
    camera_frame_id: "ascamera_hp60c_ascamera_0"
    target_frame: "world"
    
    # Camera intrinsics (placeholder)
    fx: 525.0
    fy: 525.0
    cx: 320.0
    cy: 240.0
    
    # Action generation
    confidence_threshold: 0.5
    max_inference_time: 2.0
