sensors:
  - default_sensor
default_sensor:
  filtered_cloud_topic: filtered_cloud
  max_range: 2.0
  max_update_rate: 1.0
  octomap_resolution: 0.02  # 2cm voxels (was 10cm default)
  padding_offset: 0.02
  padding_scale: 1.0
  point_cloud_topic: /ascamera_hp60c/camera_publisher/depth0/points
  point_subsample: 1
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater